name: Build zcontainer-test2

on:
  workflow_dispatch:
  push:
    tags: ['v2*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 27.x if present
        run: |
          ls /Applications | grep -i '^Xcode' || true
          XC="$(ls -d /Applications/Xcode*27*.app 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
          fi
          xcodebuild -version
      - name: Stamp unique version for this build
        # 每个 tag 包必须有唯一 CFBundleVersion，否则侧载安装器可能把新包
        # 当成同版本而拒绝覆盖，表现就是"装了最新版却跟没改一样"。
        run: |
          xcrun agvtool new-version -all "${GITHUB_RUN_NUMBER}"
          xcrun agvtool new-marketing-version "2.0.0"
      - name: Archive
        # 不再用 xcpretty：它会把 error: 行吞掉，导致失败时日志里看不到原因。
        # 原始输出保留完整错误，且不影响构建本身。
        run: |
          set -o pipefail
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" \
            -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== build errors ==="
            grep -nE "error:|错误:" build.log | head -40
          fi
          exit $status
      - name: Create IPA (unsigned, upstream packaging)
        run: sh .github/build_github.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-unsigned-ipa
          path: ${{ env.scheme }}.ipa
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.scheme }}.ipa
          tag_name: ${{ github.ref_name }}
          name: zcontainer-test2 ${{ github.ref_name }}
          body: |
            zcontainer-test2 initial build from upstream getzeusapp/LiveContainer@zcontainer (${{ github.sha }}).
            Unsigned IPA: sign with your certificate before installing.
