name: Build zcontainer (Zcontainer branch)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout (with pristine submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos -arch arm64 -configuration Release | xcpretty
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA (upstream script)
        run: sh .github/build_github.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcontainer-build-log
          path: |
            **/*.log
          if-no-files-found: warn

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zcontainer-ipa
          path: ${{ env.scheme }}.ipa
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(mktemp)"
          { echo "$(date '+%Y%m%d-%H%M%S') $TAG Update："
            echo "1. zcontainer + iManager 构建（未签名 IPA）"
            echo
            echo "[编译环境]"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Build: $(sw_vers -buildVersion 2>/dev/null || true)"
            echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          } > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$scheme.ipa" --clobber
          else
            gh release create "$TAG" --title "zcontainer $TAG" --notes-file "$NOTES" "$scheme.ipa"
          fi
