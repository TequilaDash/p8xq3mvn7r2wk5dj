name: Build zcontainer (Zcontainer branch)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    steps:
      - name: Select Xcode 27.x if present
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode' || true
          XC="$(ls -d /Applications/Xcode*27*.app 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
          fi
          xcodebuild -version

      - name: Checkout (with pristine submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA (upstream script)
        run: sh .github/build_github.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcontainer-build-log
          path: |
            build.log
          if-no-files-found: warn

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zcontainer-ipa
          path: ${{ env.scheme }}.ipa
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(mktemp)"
          # 发行说明 = changelog.md 的最新一条（到下一个版本标题或旧环境块为止）
          if [ -f changelog.md ]; then
            awk '
              /^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9] / { n++; if (n > 1) exit }
              /^\[编译环境\]/ { exit }
              { print }
            ' changelog.md > "$NOTES"
          else
            echo "$(TZ=Asia/Shanghai date '+%Y%m%d-%H%M%S') $TAG Update：" > "$NOTES"
          fi
          # 编译环境每次都现场生成（不再复用 changelog 里的旧块）
          {
            echo
            echo "[编译环境]"
            echo "Xcode: $(xcodebuild -version | head -1)"
            echo "Build: $(xcodebuild -version | tail -1 | sed 's/^Build version //')"
            echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          } >> "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$scheme.ipa" --clobber
          else
            gh release create "$TAG" --title "zcontainer $TAG" --notes-file "$NOTES" "$scheme.ipa"
          fi
