# xcodegen spec — TequilaDash Xcode 原生工程（方案 A 双轨迁移脚手架）
#
# 设计原则（来自 _build/THEOS-MIGRATION-ASSESSMENT.md）：
#   1. **本文件是唯一的构建定义。** Theos 轨道（Makefile / control / build.yml / mha-build.yml）
#      已于 2026-09-18 整体删除，只剩 Xcode 这一条轨道。
#   2. 单 module 行为：app + vendor(BitByteData/SWCompression/ApplePackage)
#      全部编进同一个 target（app 侧无 `import ApplePackage`）。
#      ApplePackage 于 v0.2.161 随 App Store 下载功能移除，v0.4.0 恢复并接入 SAP 签名。
#   3. 版本号纪律：MARKETING_VERSION / CURRENT_PROJECT_VERSION 需与 Resources/Info.plist
#      的 CFBundleShortVersionString / CFBundleVersion 一致（**只有这两处**，见 docs/releasing.md）。
#   4. 本机（Windows）无法跑 xcodebuild，本 spec 仅保证语法正确；真实编译由 macos-latest CI 验证。
#
# 用法（CI 内）：xcodegen generate  →  产出 TequilaDash.xcodeproj

name: TequilaDash

options:
  bundleIdPrefix: com.tequila
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash
    PRODUCT_NAME: TequilaDash
    MARKETING_VERSION: "0.3.808"
    CURRENT_PROJECT_VERSION: "1097"
    # 注：这里**刻意不写** `SWIFT_VERSION` —— 实测顶层 `settings.base` 的它**不被 xcodegen 采纳**，
    # 真正生效的是下面 target 层那一份（当前 `"6.0"` = Swift 6 语言模式）。
    # 另注：**编译器版本 ≠ 语言模式** —— CI 用 Xcode 27 自带的 Swift 6.4 编译器，
    # 按这里 target 层的 6.0 语言模式编译。
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 对齐 Theos：不把 Swift 运行时打进 .app（iOS 18+ 系统自带 Swift 5 ABI 稳定，
    # 嵌入反而需要额外对 Frameworks 内 dylib 签名）。单 module 应用无需嵌入。
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 对齐 Theos 的 -I 搜索路径（桥接头引用 bad_query.h / Tunnel/*.h / MCM/*.h）
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/TequilaDash"
      - "$(SRCROOT)/TequilaDash/Engine"
      - "$(SRCROOT)/TequilaDash/Tunnel"
      # ZSign 引擎（v0.3.101）+ CI 预编译的 OpenSSL 头文件
      - "$(SRCROOT)/ZSign"
      - "$(SRCROOT)/ZSign/common"
      - "$(SRCROOT)/openssl-build/include"
      # litehook / fishhook（v0.3.783，照 LiveContainer 引入；容器内启动与 JITLess 的 hook 底座）
      - "$(SRCROOT)/vendor/litehook/src"
      - "$(SRCROOT)/vendor/litehook/external/include"
      - "$(SRCROOT)/vendor/fishhook"
      # Asspp 本地 SAP 登录：unicorn 头由 prepare.sap.py 生成在 DERIVED_FILE_DIR/SAP 下
      - "$(DERIVED_FILE_DIR)/SAP/source/include"
    # 对齐 Theos 的 LDFLAGS：系统 framework。
    # Rust FFI（libidevice_ffi）自 #317 起改以 xcframework 形式分发，由下方 target
    # dependencies 的 framework 依赖链接（不再走 LIBRARY_SEARCH_PATHS + -lidevice_ffi）。
    OTHER_LDFLAGS:
      - "-lresolv"
      - "-framework Security"
      - "-framework Network"
      # 内置隧道（v0.3.586）：NETunnelProviderManager 走 NetworkExtension.
      # 显式列出以对齐其余 framework 的写法（Swift 自动链接本也会加，列出更稳）.
      - "-framework NetworkExtension"
      - "-framework SystemConfiguration"
      - "-framework QuickLook"
      - "-framework PDFKit"
      - "-framework AVKit"
      - "-framework AVFoundation"
      - "-framework CoreLocation"
      - "-framework CryptoKit"
      # ZSign（v0.3.101）：ad-hoc 重签名依赖 libcrypto（CI 预编译 iOS arm64 静态库）
      - "-L$(SRCROOT)/openssl-build"
      - "-lcrypto"
      # Asspp 本地 SAP 登录：静态链接 Unicorn TCI 解释器（无 dylib、无需嵌入）
      - "$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a"
      - "-lc++"
      # 禁用 compact unwind 表。
      # 根因：TequilaDash 同时链接两个 Rust 静态库（libidevice_ffi.a +
      # libairlift_ffi.a），二者各带一份 `_rust_eh_personality`；加上 ObjC 的
      # `___objc_personality_v0` 与 C++ 的 `___gxx_personality_v0`，超过 ld64
      # compact unwind 能编码的 4 个上限，报：
      #   ld: Too many personality routines for compact unwind to encode.
      # 注：libairlift_ffi.a 已由 build-airlift-xcframework.sh 的
      # localize_airlift_symbols() 把非 `_al_` 全局符号降级为 local（那解决的是
      # 1032 个 duplicate symbols），但 personality routine 是**链接期**由两个
      # 库各自的 unwind 段提供的，本地化管不到。
      # -no_compact_unwind 让 ld 不生成该表，改用 DWARF unwind 信息，
      # 异常/栈展开行为不变，仅二进制略大。
      - "-Wl,-no_compact_unwind"
    SWIFT_OBJC_BRIDGING_HEADER: "TequilaDash/Engine/TequilaDash-Bridging-Header.h"
    # SapMachine.cpp 用了 std::format → 必须 C++20（原分叉同理）
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    # v0.3.720：由 from: 0.8.0（开区间下界）改为 exactVersion。
    # from 不是锁定值，仓库又没有 Package.resolved，CI 每次重新解析依赖树。
    # 0.12.1 与 0.8.0 的 SFTPDelegate/ExecDelegate 方法签名完全一致（只多了 Sendable，
    # 我们已写 @unchecked Sendable），SSHServer.host 参数逐字相同，0.8.0 到 0.12.1
    # 之间无 security fix。钉 exactVersion 是为了让依赖可复现，不是为了升版本。
    # 键名必须是 exactVersion —— xcodegen 不认 exact（会报 Unknown package requirement）。
    exactVersion: 0.12.1

targets:
  TequilaDash-iOS:
    type: application
    platform: iOS
    # 方案 A #317：Rust FFI 以 xcframework 形式链接（静态库，无需 embed/runpath）。
    # xcodegen 通过 framework 依赖类型引用 .xcframework（xcodegen 无独立 xcframework 类型）。
    # rust-libs/libidevice_ffi.xcframework 由 build-xcode.yml 在 xcodegen generate 之前生成。
    dependencies:
      - package: Citadel
      - framework: rust-libs/libidevice_ffi.xcframework
        embed: false
        link: true
      # AirLift（AirTraffic 沙盒逃逸，CVE-2026-43689）：Rust `libairlift_ffi.a` 以
      # xcframework 形式链接（静态库，无需 embed/runpath）。**不是**预编译 vendor ——
      # 由 Resources/Scripts/build-airlift-xcframework.sh 在 xcodegen 之前从
      # AirCard-iOS（钉死 commit）+ airlift-read-file.patch 现场编出（见 build-xcode.yml），
      # 并由 verify-airlift.sh 校验补丁符号（al_exploit_read_file / al_bytes_free /
      # al_set_target_host / al_exploit_write_dir）。落在 rust-libs/（xcodegen source 树之外），
      # 避免 .a 被当资源拷进 .app。
      - framework: rust-libs/AirliftFFI.xcframework
        embed: false
        link: true
      # 内置隧道扩展（Phase 2）：作为 App Extension 嵌入主 App 的 PlugIns/.
      # embed 默认为 true（依赖方是 application），显式写出以自证意图；XcodeGen 会据此
      # 生成 "Embed App Extensions" 阶段，把 TequilaDashTunnel.appex 拷进 TequilaDash.app/PlugIns/.
      - target: TequilaDashTunnel
        embed: true
      # 访客进程宿主扩展（m5 方案 S2）：与 Tunnel 同款嵌入 PlugIns/；本阶段产物不被调用，
      # 由调试入口（LiveProcessDebugLauncher）按需拉起验证链路.
      - target: TequilaDashLiveProcess
        embed: true
      # Tweak 注入装载器 / JIT-less 探针: **只在运行时 dlopen, 绝不参与链接**.
      #
      # 为什么必须 embed:false: xcodegen 的 `target:` 依赖默认 `link: true`, 会往主二进制
      # 写 `LOAD_DYLIB @rpath/TweakLoader.dylib`. 而 dylib target 的
      # `DYLIB_INSTALL_NAME_BASE: "@rpath"` + 主 App 只有 `@executable_path/Frameworks`
      # 一条 rpath, dyld 找不到 → 真机启动即 SIGABRT
      # ("Library not loaded: @rpath/TweakLoader.dylib", 2026-11-10 四个 .ips 同因).
      # 上游 LC 本来就不链接它们: LCBootstrap.m:637/645 用 dlopen(绝对路径),
      # 所以这里也必须 embed:false —— 链接是错的, 加载由 dlopen 负责.
      - target: TequilaDashTweakLoader
        embed: true
        link: false
      - target: TestJITLess
        embed: true
        link: false
      # LC 模型层 + 多任务整层: framework 形式嵌入, 供本仓 UI 侧调用.
      - target: LiveContainerSwiftUI
        embed: true
      # 系统分享面板扩展（LC 上游同款）：收 URL/文件 → 拉起主 App.
      # 需要真实 app group（entitlements 里 $(APP_GROUP_SIDESTORE)/$(APP_GROUP_ALTSTORE)），
      # 侧载时由签名 profile 提供；免费账号签不出 app group 时该扩展装上也不可用.
      - target: ShareExtension
        embed: true
    sources:
      # 模块原生 UI 源码（生成目录，见 TequilaDash/Modules/README.md）——
      # 由 Resources/Scripts/sync_bundled_modules.py 在 xcodegen **之前**从
      # module-esc 仓库拷进来. **不要**再单独列 ：
      # 这一行是递归的，已经包含它；重复列会让同一批文件被编两次 ⇒ 重复符号.
      - path: TequilaDash
        # v0.3.508：排除所有 README.md —— 它们只是文档，但会被当资源拷进
        # .app 根目录；两个同名 README 直接报
        # 「Multiple commands produce .../TequilaDash.app/README.md」。
        excludes:
          - "**/README.md"
      # ZSign 引擎（LC 同款签名器，v0.3.101：ad-hoc 重签名可拆卸 dylib 模块）
      - path: ZSign
        # 排除 README.md：它会平铺进 .app 根，与其它 source 的 README.md 撞车
        # （Multiple commands produce .../TequilaDash.app/README.md）
        excludes:
          - "**/README.md"
      - path: Resources
        # 把 Resources/ 内资源（AppIcon PNG、Supervised 的 .mobileconfig、solarium.jpg 等）
        # 打进 .app bundle。此前漏把 Resources/ 纳入 xcodegen source 树，导致切到 Xcode 后
        # 应用图标与这些资源全部缺失（Theos 会自动打包 Resources/）。
        # 排除 Info.plist：它已作为 INFOPLIST_FILE 被 xcodegen 处理；若再当资源拷贝进 bundle，
        # 会与生成的 Info.plist 冲突（Multiple commands produce Info.plist）。
        # 排除 BundledModules：模块清单都以 module.json 命名，平铺进 bundle 根会互相冲突，
        # 改用下方 folder reference（蓝色文件夹）保留目录结构。
        # 排除 I4Mobile：内嵌的爱思移动端 IPA 改用下方 folder reference 保留
        # `I4Mobile/<name>.ipa` 层级（运行时按目录读取；平铺到 bundle 根既乱又易重名）。
        excludes:
          - "Info.plist"
          - "BundledModules"
          - "I4Mobile"
          # 脚本与许可证由 prepare.sap.py 处理（许可证它自己拷进 bundle/SAPAssets），
          # 不再作为普通资源重复打包
          - "Scripts"
          - "Licenses"
          # 排除 README.md：Resources/README.md 会平铺进 .app 根，与 TequilaDash/ 下
          # 的 README.md 撞车（Multiple commands produce .../TequilaDash.app/README.md）
          - "**/README.md"
      - path: Resources/BundledModules
        # v0.3.48：内置模块清单，folder reference 保留 <id>/module.json 层级，
        # 运行时经 Bundle.main.url(forResource: "BundledModules", withExtension: nil) 读取。
        type: folder
        buildPhase: resources
      - path: Resources/I4Mobile
        # v0.3.585：爱思移动端内嵌 IPA（217 / 220 / photo）——「安装爱思移动端」的移植材料。
        # folder reference 保留 `I4Mobile/<name>.ipa` 层级，运行时经
        # Bundle.main.url(forResource: "I4Mobile", withExtension: nil) 定位后拼文件名读取。
        # 注：IPA 本体被 .gitignore 的 `*.ipa` 忽略，需在打包前物理放入该目录（见其 README.md）。
        type: folder
        buildPhase: resources
      # LiveContainer 核心栈 (v0.3.790 起与扩展共享): 主 App 的双模入口需要在
      # 进程内调用 LiveContainerMain 跳访客 (HostGuestEntry.m), 故同一份源码编进两个 target.
      # 排除 LC/main.c: 那是 LC 主 App 的 -e 入口 (定义 main()), 与本 target 的 HostGuestEntry.m 撞.
      - path: TequilaDashLiveProcess/LC
        excludes:
          - "main.c"
      # litehook / fishhook（v0.3.783）：与 LiveContainer 同源同版本，
      # 只做 dyld_shared_cache 符号解析 / GOT 重绑 / 函数分支改写，无其它依赖。
      # 注意 litehook.c 会 #include "dyld_cache_format.h"，靠上面的 HEADER_SEARCH_PATHS 找到。
      - path: vendor/litehook/src
      - path: vendor/fishhook
        # LICENSE 是纯文本，落在 source 树里会被 xcodegen 当资源平铺进 .app 根。
        # 许可正文已另存 Resources/Licenses/fishhook.txt，由 prepare.sap.py 拷进 bundle/SAPAssets，
        # 所以这里只排除 LICENSE 文件本身，不动 fishhook.c/.h。
        excludes:
          - "LICENSE"
      - path: vendor/BitByteData/Sources
        # 排除 vendor 占位 PrivacyInfo.xcprivacy：两份内容完全相同且都在 Sources 根目录，
        # xcodegen 会把二者都复制进 app bundle 导致 "Multiple commands produce .../PrivacyInfo.xcprivacy"。
        # 用 xcodegen 正确的 excludes 键（注意不是 excluding/including！）按 glob 排除；
        # Theos 本也不把 Sources 内 .xcprivacy 自动打包，行为与 Theos 一致。
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: vendor/SWCompression/Sources
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      # ApplePackage（移植自 asspp）：账号模型 / 搜索 / 清单 / 下载 / 历史版本。
      # v0.3.312 起 Apple ID 登录实现（连同 Go 侧 SAP 桥 sapbridge/）已整体移除，
      # 待按 CloudOfEquality/Asspp 分叉的本地 SAP 方案重新接入；本库继续提供
      # 账号模型与下载侧能力，故保留。
      # 全部 .swift 编进同一 target（单 module，无 import）。
      - path: vendor/ApplePackage
        excludes:
          - "**/PrivacyInfo.xcprivacy"
          # 同 Resources/ZSign：README.md 平铺进 .app 根会互相撞车
          - "**/README.md"
      # CydiaSubstrate.framework (LC 同款, arm64): 作为 folder reference 落进 bundle 的
      # Frameworks/ 子路径 —— TweakLoader.m:105-106 运行时按
      # <mainBundle>/Frameworks/CydiaSubstrate.framework/CydiaSubstrate dlopen,
      # LCBootstrap.m:355-375 的 symlink 也指向这里. 上游同样走 Resources 拷贝 (pbxproj:287-294),
      # 不参与链接.
      - path: vendor/LiveContainer/Resources/Frameworks
        type: folder
        buildPhase: resources
      # LC 的 en.lproj (上游 Resources/en.lproj): LC framework 里 Shared.swift:162-166 的
      # String.enBundle 用 `Bundle(path: path!)` 强解包 en.lproj —— 缺它则首个未命中本地化键
      # 直接崩 (启动闪退真凶之一). 只带 en (LC 的 fallback 语言), 不引入 40+ 语言目录.
      - path: vendor/LiveContainer/Resources/en.lproj
        type: folder
        buildPhase: resources
      # LC 的 UI 文案目录 (String Catalog): 上游 Resources/Localizable.xcstrings (945 KB,
      # 337 键 x 16 语言). 缺它则所有 "lc.xxx.yyy" 键原样显示在界面上 —— 真机截图实测.
      # 按 owner 要求只保留 en + zh-Hans + zh-Hant (200 KB), 其余 13 种语言已剔除.
      # xcstrings 由 Xcode 编译期生成 Localizable.strings 并放进 .lproj.
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # LC 的图标资源: **物理副本** Resources/LCAssets.xcassets (237 KB, 已剔除 AppIcon.appiconset).
      #
      # 为什么不直接指 vendor 路径 + excludes: xcodegen 的 `excludes` 对 `.xcassets`
      # **内部目录无效** —— 仍会把 AppIcon.appiconset 编进 Assets.car, 主 App 图标就变成
      # LiveContainer (v0.3.802/803 两次真机实测). 只有物理剔除才可靠.
      # 上游同步时用 Resources/Scripts/sync_lc_assets.py 重新生成这个副本.
      #
      # 内容: DefaultIcon.imageset (LCAltStoreSourcesView.swift:1074 的访客占位) +
      # AccentColor/BadgeColor/JITBadgeColor/AppBannerBG/FontColor/32BitBadgeColor
      # + AppIconGrey.appiconset (访客重签时写进 Info.plist 的 CFBundleIconName) + GitHub/Twitter.
      # 用 folder reference（`type: folder`）：整个 .xcassets 目录原样拷进 bundle，
      # **不进 Assets.car 编译** —— 因此不会参与主 App 的 AppIcon 查找（CI 实测:
      # 少了 AppIcon.appiconset 时 Xcode 报 "None of the input catalogs contained a
      # matching ... app icon set ... named AppIcon"）。
      # LC 侧只用 `Image("DefaultIcon")` 等具名图，bundle 内 `LCAssets.xcassets/` 目录
      # 保留 imageset 结构，`UIImage(named:)` 能按 imageset 名解析.
      - path: Resources/LCAssets.xcassets
        type: folder
        buildPhase: resources
      # LC 直接按 **bundle 根文件名** 读的资源:
      #   · universal.js —— LCUtils.m:205 `Bundle.main.path(forResource:"universal", ofType:"js")`
      #     （网页注入脚本；缺它 LCWebView 的注入失效）
      #   · DefaultIcon.png / AppIconGrey*.png —— LCAppInfo/LCUtils 重签访客时写进访客
      #     Info.plist 的 CFBundleIconFiles，按根文件名取
      - path: vendor/LiveContainer/Resources/universal.js
        buildPhase: resources
      - path: vendor/LiveContainer/Resources/DefaultIcon.png
        buildPhase: resources
      - path: vendor/LiveContainer/Resources/AppIconGrey60x60@2x.png
        buildPhase: resources
      - path: vendor/LiveContainer/Resources/AppIconGrey76x76@2x~ipad.png
        buildPhase: resources
      # 系统「设置 → 本 App」页 (LC 上游 Settings.bundle/Root.plist)
      - path: vendor/LiveContainer/Resources/Settings.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        # Swift 6 语言模式迁移（原 `swift6-migration` 分支，2026-09-18 已合入 `migrate-xcode`）。
        #   ⚠️ 必须写在 **target** 这一层：实测顶层 `settings.base` 的 SWIFT_VERSION **不被 xcodegen 采纳**。
        #   只作用于本 target，**不会**波及 SwiftPM 依赖（Citadel / swift-crypto 等）。
        #   ⚠️ 刻意**不开** `SWIFT_APPROACHABLE_CONCURRENCY` / `SWIFT_DEFAULT_ACTOR_ISOLATION`：
        #     实测三档对照 —— 基线 134 处；只开易用并发仍是 134（零效果）；
        #     开默认 MainActor 隔离反而涨到 336（把引擎层的 nonisolated 代码全变成跨 actor 错误）。
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # 实测项（2026-09-18 第 6 轮）：对**完整**错误集重测「易用并发」。
        #   此前三档对照（134/336/134）是在**残缺**错误集上测的（编译提前中止），结论作废。
        #   SE-0461 NonisolatedNonsendingByDefault 正是用来减少 sending 诊断的。
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # 直接复用仓库已有的 Info.plist 与 entitlements（与 Theos 行为一致），
        # 不走 xcodegen 的 Plist 生成（避免覆盖现有文件 / 缺 properties 解析失败）。
        # 注：xcodegen 的 info/entitlements 是 Plist 类型，要求 path+properties 子键，
        # 这里改为用 build setting 直接引用现有文件，绕过该限制。
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TequilaDash.entitlements
        # v0.3.800 关键 (真机 .ips 114706 实测): Release 默认 GCC_SYMBOLS_PRIVATE_EXTERN=YES
        # 会把 LC 核心符号标成 N_PEXT (私有外部), 导致 LiveContainerSwiftUI.framework 的
        # -Wl,-undefined,dynamic_lookup 在 dyld 绑定时报
        # "symbol not found in flat namespace '_OBJC_CLASS_$_LCSharedUtils'" → 启动即崩.
        # LCUI 需要主二进制导出的符号 (v799 IPA 实测清单): _OBJC_CLASS_$_LCSharedUtils,
        # _LCParseMachO/_LCPatchExecSlice/_LCPatchAddRPath/_LCPatchAppBundleFixupARM64eSlice,
        # _LCIsMachOEncrypted/_LCChangeMachOUUID/_checkCodeSignature.
        # 上游/Gnoix 不踩这个坑: 它们的 LC 核心在独立 LiveContainerShared.framework 里,
        # dylib 天然导出符号. 本仓把 LC 核心静态编进主 App, 就必须显式关闭私有化.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        # LC 同款 (LiveContainer.xcodeproj:1910/1952): LC/ 源码编进主 target 后,
        # dyld_bypass_validation.h 的暂定定义同样需要 -fcommon 跨 TU 合并 (run 42478527343 同因).
        OTHER_CFLAGS:
          - "-fcommon"
    preBuildScripts:
      # Asspp 本地 SAP 登录（v0.3.323）：拉 Unicorn 源码 + 4 个 Apple SAP 资产，
      # 编出 libunicorn.a 并把 SAPAssets 拷进 bundle。必须在 Link 之前完成。
      - name: Prepare SAP
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "${SRCROOT}/Resources/Scripts/prepare.sap.py"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a"
          - "$(DERIVED_FILE_DIR)/SAP/source/include/unicorn/unicorn.h"
    postBuildScripts:
      # 把 dylib 挪进 Frameworks/ (上游 dstSubfolderSpec=10 的同款落位).
      #
      # 为什么需要: xcodegen 对 `type: library.dynamic` 的 target 依赖走 "Embed Libraries",
      # 产物落在 .app/ 根; 而 LC 的 dlopen 路径写死 `<bundle>/Frameworks/TweakLoader.dylib`
      # (LCBootstrap.m:637/645, LCUtils.m:266 的 TestJITLess), 放错位置 = 静默加载不到.
      # 上游 pbxproj 的 "Embed Frameworks" 阶段 dstSubfolderSpec=10 正是 Frameworks/.
      # 幂等: 已经在 Frameworks/ 里就不动; 只移动本 target 产物, 不碰其它文件.
      - name: Relocate LC dylibs into Frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          APP_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          FW_DIR="${APP_DIR}/Frameworks"
          mkdir -p "${FW_DIR}"
          for lib in TweakLoader.dylib TestJITLess.dylib; do
            if [ -f "${APP_DIR}/${lib}" ]; then
              mv -f "${APP_DIR}/${lib}" "${FW_DIR}/${lib}"
              echo "relocated ${lib} -> Frameworks/"
            fi
          done

  # 内置隧道扩展（Phase 2）：一个「回环反射器」Packet Tunnel Provider.
  # 语义与设计见 TequilaDashTunnel/PacketTunnelProvider.swift 头注释，以及简报
  # 「调研_VPN权限检测与内置隧道.md」§2.1–§2.2.
  #
  # ⚠️ 本 target **不改变默认签名**：默认构建（TequilaDash.entitlements）不含 NE 权限，
  #    免费账号照旧可签主 App；本扩展的 entitlements（packet-tunnel-provider）只在做
  #    「隧道版」签名时才施加（免费账号签不了，见调研简报 §2.3）. CI 以
  #    CODE_SIGNING_ALLOWED=NO 编译验证，产物 .appex 供隧道版侧载签名使用.
  TequilaDashTunnel:
    type: app-extension
    platform: iOS
    sources:
      # 只收本目录；扩展源码**不在** TequilaDash/ 下，故不会被主 App target 重复编译.
      - path: TequilaDashTunnel
    settings:
      base:
        # Network Extension 要求扩展 bundle id 以主 App bundle id 为前缀；
        # 这里取主 bundle id + ".tunnel"，与 BuiltInTunnel.providerBundleID 的约定一致.
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.tunnel
        PRODUCT_NAME: TequilaDashTunnel
        # 版本号三处同步（HARD-RULES 22）：主 App 的 settings.base 与 Resources/Info.plist 之外，
        # 扩展 target 是第三处 —— 原先这里停在 0.3.587/881（落后主 App 33 个版本），
        # 会让 .appex 的 CFBundleVersion 与主 App 不一致，iOS 安装/升级可拒或把扩展判过期。
        MARKETING_VERSION: "0.3.808"
        CURRENT_PROJECT_VERSION: "1097"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # 与主 target 同口径的 Swift 6 严格并发（详见主 target 的说明）.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        INFOPLIST_FILE: TequilaDashTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: TequilaDashTunnel/TequilaDashTunnel.entitlements
        # 扩展只用到 NetworkExtension，显式链接（对齐主 target 的写法）.
        OTHER_LDFLAGS:
          - "-framework NetworkExtension"

  # 访客进程宿主扩展: LiveContainer 的 LiveProcess 等价物 (方案 C:/Users/xcrad/.omp/work/reports/m5-extension-target-plan.md).
  # 职责: 提供一个入口早于 UIKit 的独立进程, 在其中装 hook 并跳进访客 main (S8).
  # 边界: 不承载 UI, 不承载容器目录管理 (那是 Engine/SandboxContainerStore.swift 的事).
  # 源码必须在 TequilaDash/ 之外 (方案 2.3b): 主 target 的 sources 是递归 path: TequilaDash,
  # main.m 放进去会被主 App 也编一遍, 主二进制多出 UIApplicationMain/NSExtensionMain 重定义 = 链接炸.
  TequilaDashLiveProcess:
    type: app-extension
    platform: iOS
    sources:
      # 本目录只有 main.m (Info.plist / entitlements 由下方键直取, 不当资源).
      - path: TequilaDashLiveProcess
        excludes:
          # LC/main.c 是 LC 主 App 的 -e 入口 (定义 main()), 扩展链接会撞; 扩展入口在 main.m.
          - "LC/main.c"
      # 复用主 App 已有的 C 底座, 逐个文件列, 不列目录 (方案 2.2: 列 Engine/ 会把整棵 Swift 树编进扩展).
      - path: TequilaDash/Engine/EscHookBridge.c
      - path: TequilaDash/Services/MachOLoader/uloader.c
      - path: vendor/litehook/src
      - path: vendor/fishhook
        excludes:
          - "LICENSE"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.liveprocess
        PRODUCT_NAME: TequilaDashLiveProcess
        # 版本号三处同步 (HARD-RULES 22): 与 Tunnel 同款纪律, 缺写则 .appex 的 CFBundleVersion 为空,
        # iOS 会因主 App 与扩展版本不一致拒装/判过期.
        MARKETING_VERSION: "0.3.808"
        CURRENT_PROJECT_VERSION: "1097"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        CLANG_ENABLE_OBJC_ARC: "YES"
        INFOPLIST_FILE: TequilaDashLiveProcess/Info.plist
        CODE_SIGN_ENTITLEMENTS: TequilaDashLiveProcess/TequilaDashLiveProcess.entitlements
        # 扩展要够到宿主 App 的 Frameworks/: 第二项是 LC 同款 (LiveProcess 的 LD_RUNPATH_SEARCH_PATHS).
        # 缺它则后续 dlopen 宿主 framework 失败.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        # 必须整段覆盖且**不带** $(inherited) (方案 2.3a): 顶层的 libunicorn.a 由主 target 的
        # preBuildScript 产出到主 target 自己的 DERIVED_FILE_DIR, 扩展没这个脚本, 继承 = 链接失败.
        # Tunnel 就是这样活下来的, 照抄.
        OTHER_LDFLAGS:
          - "-framework Foundation"
          - "-framework UIKit"
        # LC 同款 (LiveContainer.xcodeproj:1910/1952): dyld_bypass_validation.h 的
        # orig_dyld_* 函数指针是头内暂定定义, Dyld.m 与 dyld_bypass_validation.m 两个 TU
        # 都 include 它 —— LC 靠 -fcommon 让暂定定义跨 TU 合并 (run 42478527343 实锤
        # -fno-common 下重复符号). 照抄 LC, 不自创 extern 改写.
        OTHER_CFLAGS:
          - "-fcommon"

  # Tweak 注入装载器: LC 的 TweakLoader.dylib 等价物 (LiveContainer.xcodeproj:581-597).
  # 职责: constructor 读 LC_GLOBAL_TWEAKS_FOLDER, dlopen 全局/选定目录下的 .dylib/.framework,
  # 失败时弹 UIAlertController (TweakLoader.m:59-77). 由 LCBootstrap.m 在访客进程内 dlopen.
  # 源码 = 上游镜像原样 (不改动, 便于同步上游); 只在本仓补构建设置.
  TequilaDashTweakLoader:
    type: library.dynamic
    platform: iOS
    sources:
      - path: vendor/LiveContainer/TweakLoader
        excludes:
          - "**/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.tweakloader
        # LC 同款: EXECUTABLE_PREFIX 为空, 产物名才是 TweakLoader.dylib 而非 libTweakLoader.dylib.
        PRODUCT_NAME: TweakLoader
        EXECUTABLE_PREFIX: ""
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "0.3.808"
        CURRENT_PROJECT_VERSION: "1097"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CLANG_ENABLE_OBJC_ARC: "YES"
        CLANG_ENABLE_MODULES: "YES"
        # TweakLoader 的 4 个 .m 引用 "../LiveContainer/utils.h" 及 LCSharedUtils.h /
        # UIKitPrivate.h / FoundationPrivate.h / Localization.h, 全部在上游镜像的 LiveContainer/ 里.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/LiveContainer"
          - "$(SRCROOT)/vendor/LiveContainer/LiveContainer"
          - "$(SRCROOT)/TequilaDashLiveProcess/LC"
        # LC 同款 (LiveContainer.xcodeproj:1257-1261): 私有类符号允许未定义,
        # 运行时由宿主 UIKit/FrontBoard 提供. 不自创 -undefined dynamic_lookup.
        OTHER_LDFLAGS:
          - "-Wl,-U,_OBJC_CLASS_$_FBSSceneParameters"
          - "-Wl,-U,_OBJC_CLASS_$_LSApplicationWorkspace"
          - "-Wl,-U,_OBJC_CLASS_$_DOCConfiguration"
        # dyld_bypass_validation.h 暂定定义跨 TU 合并 (主/扩展 target 同口径).
        OTHER_CFLAGS:
          - "-fcommon"

  # JIT-less 探针 dylib: LC 的 TestJITLess 等价物 (LiveContainer.xcodeproj:643, settings :1345-1372).
  # 职责: constructor 里置 LC_JITLESS_TEST_LOADED 标记 (TestJITLess.m:3-7), 由主 App 拷进临时目录
  # 再签进测试包, 用来验证 JIT-less 环境是否能加载注入库 (LCUtils.m:262-272 读
  # <主Bundle>/Frameworks/TestJITLess.dylib). 零依赖, 上游镜像原样编译.
  TestJITLess:
    type: library.dynamic
    platform: iOS
    sources:
      - path: vendor/LiveContainer/TestJITLess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.testjitless
        # LC 同款: 前缀为空, 产物名才是 TestJITLess.dylib (LCUtils.m:266 按此名取).
        PRODUCT_NAME: TestJITLess
        EXECUTABLE_PREFIX: ""
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "0.3.808"
        CURRENT_PROJECT_VERSION: "1097"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        # 顶层 settings 的 OTHER_LDFLAGS 含 $(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a
        # (主 App 的 SAP 登录底座). 本 target 无 prepare.sap 脚本, 继承该键会在链接期
        # 找不到文件而炸 (CI run 42663291263 实测), 故整段覆盖 (对齐 Tunnel 的写法).
        OTHER_LDFLAGS:
          - "-framework Foundation"

  # ShareExtension.appex (LC 上游同款, LiveContainer.xcodeproj:717 / settings :1671-1753).
  # 职责: 系统分享面板 → 收 URL/文件 → 列出容器 App → 经 LSApplicationWorkspace 拉起主 App.
  # 依赖: LCSharedUtils（appGroupID / lcUrlSchemes）—— 由主 App 的 LC 核心提供，
  #   本 target **不重复编** LC 核心（否则同进程两份 ObjC 类）。
  # entitlements 里需要真实 app group（见 ShareExtension.entitlements 的
  #   $(APP_GROUP_SIDESTORE)/$(APP_GROUP_ALTSTORE)）—— 侧载时由签名 profile 提供.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: vendor/LiveContainer/ShareExtension
        excludes:
          # 上游桥接头与主 App 的适配桥接头同名不同义, 本 target 用自己的
          - "ShareExtension-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.ShareExtension
        PRODUCT_NAME: ShareExtension
        # Info.plist 的 NSExtensionPrincipalClass 是 $(PRODUCT_MODULE_NAME).ShareExtensionHandler,
        # 模块名必须是 ShareExtension, 否则找不到入口类.
        PRODUCT_MODULE_NAME: ShareExtension
        INFOPLIST_FILE: vendor/LiveContainer/ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: vendor/LiveContainer/ShareExtension/ShareExtension.entitlements
        MARKETING_VERSION: "0.3.808"
        CURRENT_PROJECT_VERSION: "1097"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/vendor/LiveContainer/ShareExtension/ShareExtension-Bridging-Header.h"
        # 与 LCUI framework 同款: 私有类与 LC 核心符号运行时解析, 不产生编译期链接.
        OTHER_LDFLAGS:
          - "-Wl,-undefined,dynamic_lookup"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/LiveContainer"
          - "$(SRCROOT)/vendor/LiveContainer/LiveContainer"
          - "$(SRCROOT)/TequilaDashLiveProcess/LC"
        OTHER_CFLAGS:
          - "-fcommon"

  # LiveContainerSwiftUI.framework (LC 上游同款 framework, LiveContainer.xcodeproj:558-580).
  # 编译源 = 上游镜像 LiveContainerSwiftUI/ 全层 + MultitaskSupport/ 17 文件
  # (pbxproj exception set :258-279 把它们一起挂给本 framework). 这样模型层
  # (DataManager/SharedModel/LCAppModel/LCContainer/LCAppInfo) 与多任务层在**同一个 module**,
  # 3 个 ObjC 文件 import 的 "LiveContainerSwiftUI-Swift.h" 也由本 target 生成同名头.
  # 上游原样编译, 同步上游时零改动; 唯一例外是 LCUtils.m 的 iOS/IOKit 适配副本.
  LiveContainerSwiftUI:
    type: framework
    platform: iOS
    sources:
      - path: vendor/LiveContainer/LiveContainerSwiftUI
        excludes:
          # 宿主入口是 HostGuestEntry.m -> TDHostBoot(), 上游 @main 会重复 SwiftUI.App.
          - "App/LiveContainerSwiftUIApp.swift"
          # iOS SDK 无公开 IOKit 头 (上游链接 MacOSX SDK 的 IOKit.framework),
          # 用 TequilaDashLCUIAdapters/LCUtils.m 的 iOS 适配副本代替.
          - "Utilities/LCUtils.m"
          - "**/README.md"
          # 上游桥接头原件不编: 本仓用 TequilaDashLCUIAdapters/LCUI-Bridging-Header.h
          # (同名文件两个 source path 会被 xcodegen 各复制一份 public header, 产物撞车,
          #  CI run 42631551176 实测). 镜像原件保留作上游同步参照.
          - "LiveContainerSwiftUI-Bridging-Header.h"
      - path: vendor/LiveContainer/MultitaskSupport
      - path: TequilaDashLCUIAdapters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.lcswiftui
        # 模块名必须是 LiveContainerSwiftUI: 3 个多任务 ObjC import 的生成头.
        PRODUCT_MODULE_NAME: LiveContainerSwiftUI
        PRODUCT_NAME: LiveContainerSwiftUI
        DEFINES_MODULE: "YES"
        MARKETING_VERSION: "0.3.808"
        CURRENT_PROJECT_VERSION: "1097"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # 上游用 SWIFT_VERSION 5.0 (pbxproj:1197/1240); 本仓主 target 是 6.0 complete,
        # framework 单独用 5.0 保持上游源码原样可编 (Swift 6 严格并发会炸上游 Swift 5 代码).
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_OBJC_ARC: "YES"
        CLANG_ENABLE_MODULES: "YES"
        # 上游 framework 设置 (LiveContainer.xcodeproj:1161-1244):
        # framework 必须自己有 Info.plist, 否则主 App embed 阶段报
        # "did not contain an Info.plist" (CI run 42640334187 实测).
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        # 用本仓适配桥接头 (CI run 42626661044 实测: 上游原件会让 FoundationPrivate.h
        # 被引入两次, NSExtension 等重复 @interface 导致 PCH 失败). 镜像原件保持原样.
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/TequilaDashLCUIAdapters/LCUI-Bridging-Header.h"
        # 上游 :287-294 把 CydiaSubstrate.framework 当资源, 主 App 已落 bundle, 此处不重复.
        HEADER_SEARCH_PATHS:
          # 主 App 适配副本优先: 与桥接头裸名 include 解析到同一物理路径, 避免重复 @interface.
          - "$(SRCROOT)/TequilaDashLiveProcess/LC"
          - "$(SRCROOT)/vendor/LiveContainer/LiveContainerSwiftUI"
          - "$(SRCROOT)/vendor/LiveContainer/LiveContainerSwiftUI/Models"
          - "$(SRCROOT)/vendor/LiveContainer/LiveContainerSwiftUI/Utilities"
          - "$(SRCROOT)/vendor/LiveContainer/LiveContainer"
          - "$(SRCROOT)/vendor/LiveContainer/MultitaskSupport"
          - "$(SRCROOT)/vendor/LiveContainer/ZSign"
          - "$(SRCROOT)/ZSign"
          # 生成的 Swift 头在 DERIVED_FILE_DIR, Xcode 自动可见; 显式列出便于排查.
          # ObjC 侧 import "LiveContainerSwiftUI-Swift.h" (Swift 生成的接口头).
          # Xcode 只往 -I 里加 DerivedSources*, 不加 Objects-normal/<arch>; 而 swiftc 的
          # -emit-objc-header-path 落在 Objects-normal/<arch> (CI run 42633695500 实测:
          # Swift 编译已完成, ObjC ScanDependencies 才报 file not found).
          - "$(OBJROOT)/$(PROJECT_NAME).build/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/$(TARGET_NAME).build/Objects-normal/$(CURRENT_ARCH)"
          - "$(OBJROOT)/$(PROJECT_NAME).build/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/$(TARGET_NAME).build/Objects-normal/arm64"
          - "$(BUILT_PRODUCTS_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)"
          - "$(DERIVED_FILE_DIR)"
        # 上游 :1190/1233 的私有类符号 + LCUtils.m 里 ZSigner/私有 UIKit 类.
        OTHER_LDFLAGS:
          - "-Wl,-U,_OBJC_CLASS_$_RBSTarget"
          - "-Wl,-U,_OBJC_CLASS_$_ZSigner"
          - "-Wl,-U,_OBJC_CLASS_$_FBSSceneParameters"
          - "-Wl,-U,_OBJC_CLASS_$_LSApplicationWorkspace"
          # framework 不编 LC 核心 .m: 那些符号 (LCSharedUtils/utils/LCMachOUtils/
          # Localization/LCAppInfo) 已编进主 App 二进制 (TequilaDashLiveProcess/LC
          # 适配副本). 动态库链接时允许未定义, 运行时从主可执行文件解析 ——
          # 上游用 LiveContainerShared.framework 统一提供, 本仓用 dynamic_lookup 达到同一效果,
          # 避免同进程出现两份 ObjC 类实现.
          - "-Wl,-undefined,dynamic_lookup"
        OTHER_CFLAGS:
          - "-fcommon"
